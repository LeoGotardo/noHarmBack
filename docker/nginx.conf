# Full nginx config — replaces /etc/nginx/nginx.conf in the image.
#
# nginx is the only public listener in the container. uvicorn binds 127.0.0.1,
# so the backend has no route in that does not pass through here.
#
# The server block is NOT here: entrypoint.sh installs one of
# server.alb.conf / server.tls.conf as /etc/nginx/server.conf according to
# TLS_MODE, and generates /etc/nginx/forwarded.conf beside it. Both are
# includes below, so the two modes share every setting in this file.

worker_processes auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # real_ip setup + the $forwardedProto map, generated per TLS_MODE.
    # Must come before log_format: in alb mode it is what makes $remote_addr
    # the client rather than the load balancer's ENI.
    include /etc/nginx/forwarded.conf;

    # $hostAllowed, generated from PUBLIC_HOSTNAMES (see entrypoint.sh).
    include /etc/nginx/hosts.conf;

    log_format main '$remote_addr - $status "$request" $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;

    # Slow-client limits. A connection that trickles its headers or body is
    # holding a worker and memory on a 913 MB box; nothing legitimate here
    # takes ten seconds to send a request. Idle keep-alives are let go after
    # 15 s rather than 65. The socket's long-lived reads are set in its own
    # location (app_locations.conf) and are not affected.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     15s;

    # The largest legitimate REST body is a Firebase ID token plus a few
    # hundred characters of form — a few KB. 64 KB is generous headroom and
    # still refuses a large body before it is buffered. Socket.IO's polling
    # transport can batch packets, so /ws/ gets its own, larger cap.
    client_max_body_size 64k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    upstream backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    include /etc/nginx/server.conf;
}
