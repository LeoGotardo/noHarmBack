; Two processes in one container, so something has to be PID 1 and reap them.
; If either dies the container must die with it: nginx alone serves a site with
; no API, uvicorn alone is unreachable. Neither half is worth staying up for,
; and a container that exits is one an orchestrator will replace.

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:uvicorn]
command=/usr/local/bin/python /app/src/run.py
directory=/app
user=appuser
autostart=true
autorestart=false
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; nginx must not daemonise or supervisor loses track of it immediately.
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=false
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:exit_on_failure]
; supervisord's own exit code is not tied to its children, so without this a
; crashed uvicorn leaves the container Running with a dead backend — healthy to
; anything watching the process, 502 to everyone else.
command=bash -c "printf 'READY\n'; while read -r _; do kill -SIGQUIT $PPID; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
