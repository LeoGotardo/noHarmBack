# Headers every proxied location sends upstream.
#
# X-Forwarded-For is SET, never added to. The stock snippet everyone pastes is
# `$proxy_add_x_forwarded_for`, which appends $remote_addr to whatever the
# client sent — so a client that sends its own X-Forwarded-For gets its value
# preserved as the left part of the chain. The backend resolves the client from
# that chain, and its rate-limit bucket is keyed on the result: a caller
# rotating the header would mint a fresh bucket per request and never be
# limited.
#
# $remote_addr is the resolved client in both TLS modes, which is what makes
# the single line below correct in both:
#   - TLS_MODE=container: nginx terminates TLS, so it is the real peer straight
#     off the socket and there is no upstream proxy to reconcile.
#   - TLS_MODE=alb: forwarded.conf enables real_ip with the load balancer's
#     subnets in set_real_ip_from, so nginx has already walked X-Forwarded-For
#     right-to-left past every trusted hop and rewritten $remote_addr to the
#     first address it does not trust. A forged left-hand entry never survives
#     that walk.
# Either way the backend keeps TRUSTED_PROXIES at loopback only: from uvicorn's
# side the peer is still nginx and the chain it is handed is one hop long.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $forwardedProto;
