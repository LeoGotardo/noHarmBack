# Security headers for everything nginx serves itself (the SPA).
#
# `always` matters: without it nginx drops these on error responses, so a 404 or
# a 502 would come back unprotected.
#
# The backend sets its own equivalents on /api responses via
# SecurityHeadersMiddleware. Both existing is fine — nginx does not add these to
# a proxied response unless told to, so there is no duplication.
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP for the app shell. Every non-'self' entry below is load-bearing — the app
# breaks without it, quietly, in the console:
#
#   style-src/font-src  index.html pulls Figtree, Manrope and Spectral from
#                       Google Fonts. The stylesheet comes from googleapis,
#                       the font files from gstatic — both are needed.
#   script-src apis.google.com  firebase/auth loads the Google sign-in client
#                       from there for signInWithPopup().
#   frame-src           signInWithPopup() also plants a hidden iframe on the
#                       project's authDomain, and the consent screen lives on
#                       accounts.google.com.
#   connect-src         identitytoolkit issues the ID token, securetoken
#                       refreshes it. 'self' covers the same-origin wss:// for
#                       socket.io (CSP3 folds ws/wss into 'self'); if the socket
#                       ever gets blocked with a CSP error, this is the line.
#
# NOTE: the firebaseapp.com host below is project-specific. It must match
# VITE_FIREBASE_AUTH_DOMAIN in the build — change the Firebase project and
# Google login dies here with a CSP violation and no other symptom.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://noharm-6cc9d.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
