# TLS_MODE=alb — TLS ends at the AWS load balancer, not here.
#
# The container listens on plain :80 only and never redirects to https: the ALB
# listener does that, and a redirect here would loop (the ALB forwards over
# http, so nginx would 301 every request it receives).
#
# HSTS is still correct: the browser's connection to the ALB is https, and
# security_headers.conf is what tells it to keep it that way.
#
# The real client IP arrives in X-Forwarded-For and is restored into
# $remote_addr by /etc/nginx/forwarded.conf — see entrypoint.sh. Without that,
# every request would look like it came from the ALB's ENI and the whole
# internet would share one rate-limit bucket.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    include /etc/nginx/security_headers.conf;
    include /etc/nginx/app_locations.conf;
}
