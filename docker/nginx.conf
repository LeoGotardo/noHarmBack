# Full nginx config — replaces /etc/nginx/nginx.conf in the image.
#
# nginx is the only public listener in the container. uvicorn binds 127.0.0.1,
# so the backend has no route in that does not pass through here.
#
# The server block is NOT here: entrypoint.sh installs one of
# server.alb.conf / server.tls.conf as /etc/nginx/server.conf according to
# TLS_MODE, and generates /etc/nginx/forwarded.conf beside it. Both are
# includes below, so the two modes share every setting in this file.

worker_processes auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # real_ip setup + the $forwardedProto map, generated per TLS_MODE.
    # Must come before log_format: in alb mode it is what makes $remote_addr
    # the client rather than the load balancer's ENI.
    include /etc/nginx/forwarded.conf;

    log_format main '$remote_addr - $status "$request" $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Socket.IO accepts frames up to 2 MB (max_http_buffer_size); leave headroom
    # for REST bodies without letting an upload sit in RAM.
    client_max_body_size 4m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    upstream backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    include /etc/nginx/server.conf;
}
