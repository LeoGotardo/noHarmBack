# The app itself: static bundle, REST, WebSocket, health.
#
# Included by both server templates (server.alb.conf and server.tls.conf), so
# the routing is identical in either TLS mode and only the listener differs.
# Included INSIDE a server block — it declares no `server` of its own.

root /usr/share/nginx/html;

# ── REST ────────────────────────────────────────────────────────────────────
# The trailing slash on proxy_pass is what strips the /api prefix:
# /api/users/me reaches the backend as /users/me. Drop the slash and every
# route 404s.
location /api/ {
    proxy_pass http://backend/;
    include /etc/nginx/proxy_headers.conf;
    proxy_http_version 1.1;
    # Required for the upstream keepalive pool.
    proxy_set_header Connection "";
}

# ── WebSocket ───────────────────────────────────────────────────────────────
# No URI on proxy_pass, so the path goes through untouched: the backend mounts
# socket.io at the literal /ws/socket.io/ (socketio_path carries the mount
# prefix), and rewriting anything here would 404 the handshake.
location /ws/ {
    proxy_pass http://backend;
    include /etc/nginx/proxy_headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    # A socket with no traffic must not be culled at the default 60s.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    # Buffering would hold frames back and defeat the point.
    proxy_buffering off;
}

# ── Health ──────────────────────────────────────────────────────────────────
# Exempt from the app's rate limiter already; keep it out of the log too.
# Reachable over plain :80 in both modes — that is what the container
# HEALTHCHECK and the ALB target-group check hit.
location = /health {
    proxy_pass http://backend/health;
    include /etc/nginx/proxy_headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}

# ── Static ──────────────────────────────────────────────────────────────────
# Vite emits content-hashed filenames here, so a stale copy is impossible and
# the response can be cached for good.
location /assets/ {
    # `expires 1y` is deliberately not used: it emits a Cache-Control of its
    # own, so the response went out with two of them. One header, set here.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # add_header does not inherit into a location that declares its own, so the
    # security headers have to be repeated here.
    include /etc/nginx/security_headers.conf;
    try_files $uri =404;
}

# SPA fallback. index.html itself must never be cached: it is what points at
# the hashed bundles, so a cached copy pins the app to an old deploy.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security_headers.conf;
}
