# TLS_MODE=container — nginx terminates TLS itself.
#
# The certificate pair is a hard dependency; entrypoint.sh refuses to start
# without it. Used by compose.prod.yaml and by any deployment that puts the
# container directly on the internet (an EC2 host with an elastic IP, an NLB in
# TCP passthrough).
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # certbot --webroot writes here. Must stay above the catch-all redirect:
    # renewal is plain HTTP and a 301 would break it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The container HEALTHCHECK hits this over plain :80 so that one command
    # works in both TLS modes. It reveals nothing that https://host/health does
    # not already serve publicly.
    location = /health {
        proxy_pass http://backend/health;
        include /etc/nginx/proxy_headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the `http2 on;` directive: this image is
    # Debian bookworm, whose nginx is 1.22, and the standalone directive only
    # exists from 1.25.1.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/security_headers.conf;
    include /etc/nginx/app_locations.conf;
}
