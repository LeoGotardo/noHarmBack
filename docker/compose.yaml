services:
  # O Banco de Dados Postgres
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: noharm-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d noharm-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # O Banco de Dados Redis
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A sua Aplicação Python
  app:
    build:
      context: ../
      # Dockerfile.dev, not Dockerfile: the production image is multi-stage,
      # builds the Vite bundle and fronts everything with nginx over TLS. None
      # of that belongs in a hot-reload loop, and its build context is the
      # parent of both repos rather than this one.
      dockerfile: docker/Dockerfile.dev
    container_name: noharm-backend
    environment:
      - APP_ENV=dev
      # Requests reach the container from the compose bridge gateway, so without
      # this every client shares one rate-limit bucket and a single user can lock
      # the whole API out. Trusting the bridge lets X-Forwarded-For identify the
      # real client again.
      #
      # Scoped to Docker's private pool on purpose. Published ports keep the
      # original source address for hosts outside this machine, so widening this
      # to 192.168.0.0/16 or 10.0.0.0/8 would mark every machine on the LAN as a
      # proxy and let them forge X-Forwarded-For.
      - TRUSTED_PROXIES=["172.16.0.0/12","127.0.0.1/32"]
      # /auth/* verifies a Firebase ID token, and neither the E2E suite nor a
      # browser under Playwright can produce one signed by Google — the Google
      # popup is blocked in automation.
      #
      # This makes firebase_admin skip the signature check. The `aud`, `iss` and
      # `sub` claims are still enforced, so a token minted for another project is
      # still refused, but expiry is not checked and anyone can authenticate as
      # anyone. Nothing is contacted at the address below; the variable's
      # presence is the switch.
      #
      # DEV AND TEST ONLY. Setting this in a deployed environment removes
      # authentication entirely.
      - FIREBASE_AUTH_EMULATOR_HOST=localhost:9099
      # What tokens are matched against, real or minted. Real Google tokens for
      # this project keep working, so interactive login still works locally.
      - FIREBASE_PROJECT_ID=noharm-6cc9d
    ports:
      - "8080:8080"
    # run.py passa reload=DEBUG ao uvicorn, e em dev DEBUG é true. Sem este mount
    # o reloader vigia a cópia congelada dentro da imagem, então nada recarrega:
    # cada alteração exigia rebuild. .secrets.toml fica em /app, fora do mount.
    volumes:
      - ../src:/app/src
    # O 'depends_on' garante que o app só sobe após o banco e o redis estarem de pé.
    # Vale só para container novo: se o app já estiver Running de uma tentativa
    # anterior, o compose o deixa como está e a condição não é reavaliada. Use
    # `docker compose down` (ou `up --force-recreate`) depois de uma subida que
    # falhou, senão o app fica no ar sem o postgres ter existido na rede.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: